</div>
<script type="text/javascript">	
		var splash = document.getElementById('splash');
		var codeImg1 = document.getElementById('codeImg');
		var logo = document.getElementById('company-logo');
    	function onresize(){
    	    var w=window._width||window.innerWidth;    //screen.width;
    		var h=window._height||window.innerHeight;  //screen.height;
    		if (w>h){
    			var sx=h/1080;
    			var sy=w/1920;
    			var s = Math.max(sx,sy);
    			splash.style.transform=splash.style.webkitTransform="scale("+s+","+s+")";
    			logo.style.transform=logo.style.webkitTransform="scale("+s+","+s+")";
    			codeImg.style.transform=codeImg.style.webkitTransform="scale("+(s*2.3)+","+(s*2.3)+")";
				logo.style.bottom = s * 250 + "px";
    		}else{
    			var sx=-1;
    			var sy=h/1920;
    			var s = Math.max(sx,sy);//alert('sx:'+sx+',sy:'+sy);
    			splash.style.transform=splash.style.webkitTransform="scale("+s+","+s+")";
    			logo.style.transform=logo.style.webkitTransform="scale("+s+","+s+")";
    			codeImg.style.transform=codeImg.style.webkitTransform="scale("+(s*2.3)+","+(s*2.3)+")";
				logo.style.bottom = s * 250 + "px";
    		}
    	}
		onresize();
    	window.addEventListener('resize', onresize,false);
</script>
